version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Pre-build phase started"
      - pwd
      - ls -lrta
      - sudo apt-get install openjdk-17-jdk -y
      # Create Environment Variables
      - echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64/" >> /etc/environment
      # Compile the Configuration
      - source /etc/environment

      - mvn clean install sonar:sonar

  build:
    commands:
      - echo "Build started on $(date)"
      - mvn package
      - echo "Build completed on $(date)"
      - cp -pvr settings.xml ~/.m2/
      - mvn deploy 

  post_build:
    commands:
      - echo "Delivering artifact to remote Tomcat server on $(date)"
      - curl -u admin:Str0ngAdminPassw3rd -T target/*.war "http://54.205.114.244:8080/manager/text/deploy?path=/c3ops&update=true"
      
      - echo "Checking application deployment status..."
      - curl --retry-delay 10 --retry 5 "http://54.205.114.244:8080/c3ops"

      # - echo "Delivering artifact to remote Tomcat server on $(date)"
